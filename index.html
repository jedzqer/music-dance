<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音乐可视化</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body class="layout-two">
    <div class="title-bar" id="title-bar">
        <span class="title-bar-text">音乐可视化</span>
        <div class="title-bar-controls">
            <button id="win-minimize" title="最小化">
                <svg viewBox="0 0 12 12" fill="currentColor"><rect x="2" y="5.5" width="8" height="1"/></svg>
            </button>
            <button id="win-maximize" title="最大化">
                <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1"><rect x="2" y="2" width="8" height="8" rx="1"/></svg>
            </button>
            <button id="win-close" title="关闭">
                <svg viewBox="0 0 12 12" fill="currentColor"><path d="M2.4 1.1L6 4.7l3.6-3.6 1.3 1.3L7.3 6l3.6 3.6-1.3 1.3L6 7.3l-3.6 3.6-1.3-1.3L4.7 6 1.1 2.4z"/></svg>
            </button>
        </div>
    </div>

    <button class="viz-switcher-btn" id="viz-switcher-btn" title="可视化风格">
        <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M4 20h4V10H4v10zm6 0h4V4h-4v16zm6 0h4v-8h-4v8z"/>
        </svg>
    </button>

    <canvas id="canvas"></canvas>

    <div class="cover-art" id="cover-art">
        <img id="cover-img" alt="专辑图">
    </div>

    <div class="home-page" id="home-page">
        <div class="home-sidebar">
            <div class="home-logo">
                <h1>♫ 音乐可视化</h1>
                <p class="home-subtitle">感受节奏的视觉魅力</p>
            </div>
            <div class="home-actions">
                <label class="home-btn" for="file-input">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
                    打开音乐文件
                </label>
                <button class="home-btn" id="folder-btn">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
                    打开音乐文件夹
                </button>
                <button class="home-btn home-btn-monitor" id="monitor-btn">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55C7.79 13 6 14.79 6 17s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
                    监听模式
                </button>
            </div>
            <input type="file" id="file-input" accept="audio/*">
            <p class="home-drop-hint">或拖放音频文件到页面</p>
            <div class="home-sidebar-footer">
                <button class="home-settings-btn" id="home-settings-btn" title="设置">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.49.49 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 00-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1115.6 12 3.6 3.6 0 0112 15.6z"/></svg>
                    设置
                </button>
            </div>
        </div>
        <div class="home-content">
            <div class="home-list-header">
                <h2>音乐库</h2>
                <span class="home-list-count" id="home-list-count">0 首歌曲</span>
            </div>
            <div class="home-search-wrap" id="home-search-wrap">
                <svg class="home-search-icon" viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                <input type="text" id="home-search" placeholder="搜索歌曲..." autocomplete="off">
            </div>
            <div class="home-list" id="home-list">
                <div class="home-list-empty">暂无音乐，请选择文件夹</div>
            </div>
        </div>

        <div class="mini-player" id="mini-player" aria-label="迷你播放控制栏">
            <div class="mini-player-cover">
                <img id="mini-cover-img" alt="专辑图">
            </div>
            <div class="mini-player-info">
                <div class="mini-player-title" id="mini-track-name">未选择音乐</div>
                <div class="mini-player-status" id="mini-playback-status">准备播放</div>
            </div>
            <div class="mini-player-actions">
                <button id="mini-prev-btn" title="上一首" aria-label="上一首">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>
                <button class="mini-play-btn" id="mini-play-btn" title="播放 / 暂停" aria-label="播放 / 暂停">
                    <svg class="mini-icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                    <svg class="mini-icon-pause" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
                <button id="mini-next-btn" title="下一首" aria-label="下一首">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>
            </div>
            <div class="mini-player-progress">
                <input type="range" id="mini-progress" min="0" max="1000" value="0" aria-label="播放进度">
            </div>
            <button class="mini-open-player" id="mini-open-player" title="返回播放页" aria-label="返回播放页">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 5l-1.41 1.41L16.17 10H4v2h12.17l-3.58 3.59L14 17l6-6z"/></svg>
                <span>返回播放页</span>
            </button>
        </div>
    </div>

    <div class="playlist-panel" id="playlist-panel">
        <div class="playlist-header">
            <h3>播放列表</h3>
            <span class="playlist-count" id="playlist-count">0 首歌曲</span>
            <button class="playlist-close" id="playlist-close">×</button>
        </div>
        <div class="playlist-content" id="playlist-content"></div>
    </div>

    <div class="modal-overlay" id="modal-overlay"></div>

    <div class="settings-panel" id="settings-panel">
        <div class="settings-header">
            <h3>播放设置</h3>
            <button class="settings-close" id="settings-close">&times;</button>
        </div>
        <div class="settings-content" id="settings-content">
            <div class="settings-group">
                <div class="settings-label">可视化质量</div>
                <div class="settings-row">
                    <button class="settings-option" data-fft="512">低</button>
                    <button class="settings-option" data-fft="1024">中</button>
                    <button class="settings-option" data-fft="2048">高</button>
                </div>
            </div>
            <div class="settings-group">
                <div class="settings-label">频谱平滑度</div>
                <div class="settings-row">
                    <button class="settings-option" data-smoothing="0.5">低</button>
                    <button class="settings-option" data-smoothing="0.65">中低</button>
                    <button class="settings-option" data-smoothing="0.72">中</button>
                    <button class="settings-option" data-smoothing="0.85">高</button>
                </div>
            </div>
            <div class="settings-group">
                <div class="settings-label">自动加载外部歌词</div>
                <div class="settings-row">
                    <button class="settings-option" id="settings-lrc-toggle">开启</button>
                </div>
            </div>
            <div class="settings-group">
                <div class="settings-label">播放速度</div>
                <div class="settings-row">
                    <button class="settings-option" data-rate="0.5">0.5x</button>
                    <button class="settings-option" data-rate="0.75">0.75x</button>
                    <button class="settings-option" data-rate="1">1x</button>
                    <button class="settings-option" data-rate="1.25">1.25x</button>
                    <button class="settings-option" data-rate="1.5">1.5x</button>
                    <button class="settings-option" data-rate="2">2x</button>
                </div>
            </div>
            <div class="settings-group">
                <div class="settings-label">曲目切换淡入淡出</div>
                <div class="settings-row">
                    <button class="settings-option" data-crossfade="0">关闭</button>
                    <button class="settings-option" data-crossfade="2">2秒</button>
                    <button class="settings-option" data-crossfade="3">3秒</button>
                    <button class="settings-option" data-crossfade="5">5秒</button>
                </div>
            </div>
            <div class="settings-group">
                <div class="settings-label">曲目间自动暂停</div>
                <div class="settings-row">
                    <button class="settings-option" data-pause="0">关闭</button>
                    <button class="settings-option" data-pause="3">3秒</button>
                    <button class="settings-option" data-pause="5">5秒</button>
                    <button class="settings-option" data-pause="10">10秒</button>
                </div>
            </div>
        </div>
    </div>

    <div class="settings-panel" id="app-settings-panel">
        <div class="settings-header">
            <h3>软件设置</h3>
            <button class="settings-close" id="app-settings-close">&times;</button>
        </div>
        <div class="settings-content" id="app-settings-content">
            <div class="settings-group">
                <div class="settings-label">关于</div>
                <div class="settings-about">
                    <div class="settings-about-row">
                        <span>当前版本</span>
                        <span id="settings-current-version">—</span>
                    </div>
                    <div class="settings-about-row">
                        <span>项目仓库</span>
                        <a id="settings-repo-link" href="https://github.com/jedzqer/music-dance" target="_blank" rel="noopener noreferrer">github.com/jedzqer/music-dance</a>
                    </div>
                    <div class="settings-row">
                        <button class="settings-option" id="settings-check-update-btn">检查更新</button>
                    </div>
                    <div class="settings-update-status" id="settings-update-status"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="viz-switcher-panel" id="viz-switcher-panel">
        <div class="viz-switcher-header">
            <h3>可视化风格与管理</h3>
            <div class="viz-switcher-header-actions">
                <button class="viz-header-btn" id="viz-import-btn" title="导入可视化包 (.zip / .html)">
                    <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                    导入
                </button>
                <button class="viz-switcher-close">&times;</button>
            </div>
        </div>
        <div class="viz-switcher-content">
            <div class="viz-switcher-options" id="viz-switcher-list">
                <!-- 动态渲染可视化项 -->
            </div>
            <div class="viz-footer-actions">
                <button class="viz-footer-btn" id="viz-open-folder-btn">
                    <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
                    打开效果文件夹
                </button>
                <button class="viz-footer-btn" id="viz-reload-btn">
                    <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                    刷新
                </button>
            </div>
        </div>
    </div>

    <div class="progress-container" id="progress-container">
        <div class="progress-track"></div>
        <div class="progress-fill" id="progress-fill"></div>
        <div class="progress-thumb" id="progress-thumb"></div>
        <div class="progress-time-tip" id="progress-time-tip"></div>
    </div>

    <div class="lyrics-panel" id="lyrics-panel">
        <div class="lyrics-header">
            <h3>NOW PLAYING</h3>
            <span class="track-name" id="track-name">—</span>
        </div>
        <div id="lyrics-content"></div>
    </div>

    <div class="controls" id="controls">
        <button id="play-btn" title="播放 / 暂停">
            <svg class="icon icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            <svg class="icon icon-pause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button id="prev-btn" title="上一首">
            <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button id="next-btn" title="下一首">
            <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
        <button id="playlist-btn" title="播放列表">
            <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
        </button>
        <button id="shuffle-btn" title="随机播放">
            <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
        </button>
        <button id="loop-btn" title="循环模式">
            <svg class="icon icon-loop-all" viewBox="0 0 24 24" fill="currentColor"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
            <svg class="icon icon-loop-one" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4zm-4-2V9h-1l-2 1v1h1.5v4H13z"/></svg>
        </button>
        <button id="settings-btn" title="设置">
            <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.49.49 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 00-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1115.6 12 3.6 3.6 0 0112 15.6z"/></svg>
        </button>
        <div class="vol-wrap">
            <svg class="vol-icon" viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            <input type="range" id="volume-slider" min="0" max="100" value="75">
        </div>
    </div>

    <div class="error-toast" id="error-toast"></div>

    <script type="module" src="/src/app.js"></script>
</body>
</html>
