<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自定义可视化模板开发示例</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at center, #1a1a2e 0%, #0f0f1b 100%);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .info-panel {
            position: relative;
            z-index: 2;
            text-align: center;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.4);
            padding: 20px 40px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .track-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        .track-lyrics {
            font-size: 16px;
            color: #00d2ff;
            min-height: 24px;
            transition: all 0.2s ease;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div class="info-panel">
        <div class="track-title" id="track-title">等待播放音乐...</div>
        <div class="track-lyrics" id="track-lyrics">🎵</div>
    </div>

    <script>
        /**
         * ==========================================
         * MusicDance 可视化标准开发模板 (Boilerplate)
         * ==========================================
         * 
         * 本页面在 MusicDance 提供的 iframe 沙箱中安全运行。
         * 通过全局对象 window.$musicDance 与宿主程序实时交互。
         */

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const titleEl = document.getElementById('track-title');
        const lyricsEl = document.getElementById('track-lyrics');

        let W = 0, H = 0;
        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // 检查 $musicDance SDK 是否注入成功
        if (window.$musicDance) {
            // 1. 监听歌曲切换事件
            window.$musicDance.onTrackChange((track) => {
                titleEl.textContent = `${track.title || '未知曲目'} - ${track.artist || '未知艺术家'}`;
            });

            // 2. 监听歌词同步事件
            window.$musicDance.onLyricsUpdate((lyrics) => {
                if (lyrics.currentLine) {
                    lyricsEl.textContent = lyrics.currentLine;
                }
            });

            // 3. 监听每帧实时渲染数据 (60fps ~ 144fps)
            window.$musicDance.onFrame((frame) => {
                const { frequencyData, timeDomainData, beat, playback } = frame;
                
                // 清屏
                ctx.clearRect(0, 0, W, H);

                if (!frequencyData || frequencyData.length === 0) return;

                // 示例：绘制底部音频柱状条
                const barCount = 48;
                const barWidth = W / barCount;
                const step = Math.floor(frequencyData.length / barCount);

                for (let i = 0; i < barCount; i++) {
                    const value = frequencyData[i * step] / 255;
                    const barHeight = value * (H * 0.4);

                    const grad = ctx.createLinearGradient(0, H - barHeight, 0, H);
                    grad.addColorStop(0, '#00d2ff');
                    grad.addColorStop(1, '#3a7bd5');

                    ctx.fillStyle = grad;
                    ctx.fillRect(i * barWidth + 2, H - barHeight, barWidth - 4, barHeight);
                }
            });

            // 示例：如果你希望这个模版完全接管全屏 UI，可调用接管接口（默认全显）：
            // window.$musicDance.ui.setNativeUI({ controls: true, lyrics: true, progressBar: true });
        }
    </script>
</body>
</html>
