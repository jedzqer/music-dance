<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>波浪线条可视化</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050510;
        }
        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let W = 0, H = 0, cx = 0, cy = 0;

        const NUM_LINES = 7;
        const LINE_SEGMENTS = 128;
        let avgVolume = 0;
        let climaxLevel = 0;
        let lineDisplacements = new Float32Array(NUM_LINES * LINE_SEGMENTS);
        let particles = [];
        let shockwaves = [];
        let beatHistory = [];
        let lastBeatTime = 0;
        let bassPulse = 0;
        let beatEnergy = 0;
        let currentPalette = null;

        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
            cx = W / 2;
            cy = H / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        function hslToRgb(h, s, l) {
            h = ((h % 360) + 360) % 360;
            s /= 100;
            l /= 100;
            const c = (1 - Math.abs(2 * l - 1)) * s;
            const x = c * (1 - Math.abs((h / 60) % 2 - 1));
            const m = l - c / 2;
            let r = 0, g = 0, b = 0;
            if (h < 60) { r = c; g = x; }
            else if (h < 120) { r = x; g = c; }
            else if (h < 180) { g = c; b = x; }
            else if (h < 240) { g = x; b = c; }
            else if (h < 300) { r = x; b = c; }
            else { r = c; b = x; }
            return [(r + m) * 255, (g + m) * 255, (b + m) * 255];
        }

        function detectBeat(bassAvg, t) {
            const now = t;
            beatHistory.push({ time: now, val: bassAvg });
            while (beatHistory.length > 0 && now - beatHistory[0].time > 1.2) {
                beatHistory.shift();
            }
            let histAvg = 0;
            for (let i = 0; i < beatHistory.length; i++) histAvg += beatHistory[i].val;
            histAvg /= Math.max(1, beatHistory.length);

            const threshold = Math.max(0.12, histAvg * 1.35);
            const cooldown = 0.22;
            const isBeat = bassAvg > threshold && (now - lastBeatTime) > cooldown && bassAvg > 0.18;

            if (isBeat) {
                lastBeatTime = now;
                bassPulse = 1.0;
                beatEnergy = Math.min(1.0, beatEnergy + (bassAvg - threshold) * 3.0);
            } else {
                bassPulse *= 0.88;
                beatEnergy *= 0.94;
            }
            return isBeat;
        }

        function addShockwave(hue) {
            shockwaves.push({ progress: 0, maxRadius: Math.max(W, H) * 0.5, hue, alpha: 0.8 });
        }

        function spawnParticles(cx, cy, count, hue, speed) {
            for (let i = 0; i < count; i++) {
                if (particles.length >= 250) break;
                const angle = Math.random() * Math.PI * 2;
                const spd = (0.5 + Math.random() * 0.8) * speed;
                particles.push({
                    x: cx,
                    y: cy,
                    vx: Math.cos(angle) * spd,
                    vy: Math.sin(angle) * spd,
                    life: 1.0,
                    decay: 0.01 + Math.random() * 0.02,
                    size: 2 + Math.random() * 3,
                    hue: hue + (Math.random() - 0.5) * 30
                });
            }
        }

        if (window.$musicDance) {
            window.$musicDance.onTrackChange((track) => {
                currentPalette = track.coverPalette;
            });

            window.$musicDance.onFrame((frame) => {
                const { frequencyData, timestamp } = frame;
                const t = timestamp;

                let intensity = 0;
                let bassAvg = 0;
                let climaxTarget = 0;

                if (frequencyData && frequencyData.length > 0) {
                    let sum = 0;
                    for (let i = 0; i < frequencyData.length; i++) sum += frequencyData[i];
                    const curVol = sum / frequencyData.length / 255;
                    avgVolume += (curVol - avgVolume) * 0.06;

                    const bassBins = Math.min(16, frequencyData.length);
                    for (let i = 0; i < bassBins; i++) bassAvg += frequencyData[i];
                    bassAvg /= bassBins * 255;

                    climaxTarget = Math.max(0, Math.min(1, (curVol - 0.22) * 2.8));
                    climaxLevel += (climaxTarget - climaxLevel) * 0.07;
                    intensity = avgVolume * 0.7 + climaxLevel * 0.3;
                } else {
                    climaxLevel += (0 - climaxLevel) * 0.03;
                    avgVolume += (0 - avgVolume) * 0.03;
                    intensity = Math.max(0, avgVolume);
                }

                const beatHit = detectBeat(bassAvg, t);
                if (beatHit) {
                    const hue = 205 - climaxLevel * 205;
                    addShockwave(hue);
                    spawnParticles(cx, cy, 24 + Math.floor(climaxLevel * 34), hue, 4 + climaxLevel * 7);
                }

                const globalIntensity = Math.min(1, intensity * 2.2 + 0.08);
                const baseTrail = 0.12 - climaxLevel * 0.03;
                const bgHue = 218 - climaxLevel * 120 + Math.sin(t * 0.08) * 18;
                const bgPulse = 0.5 + Math.sin(t * 0.32) * 0.5;
                const [bgR, bgG, bgB] = hslToRgb(Math.max(0, bgHue), 76, 7 + bgPulse * 3 + globalIntensity * 5);

                ctx.fillStyle = `rgba(${Math.round(bgR)},${Math.round(bgG)},${Math.round(bgB)},${Math.max(0.045, baseTrail)})`;
                ctx.fillRect(0, 0, W, H);

                // Wave lines
                const minDim = Math.min(W, H);
                const lineSpacing = minDim * 0.055;
                const startY = cy - ((NUM_LINES - 1) * lineSpacing) / 2;

                for (let l = 0; l < NUM_LINES; l++) {
                    const lineY = startY + l * lineSpacing;
                    const lineOffset = l * LINE_SEGMENTS;
                    const linePhase = l * 0.45;

                    ctx.beginPath();
                    for (let s = 0; s < LINE_SEGMENTS; s++) {
                        const normX = s / (LINE_SEGMENTS - 1);
                        const x = normX * W;

                        const freqIdx = Math.floor(normX * (frequencyData ? frequencyData.length * 0.6 : 64));
                        const rawAmp = frequencyData ? (frequencyData[freqIdx] || 0) / 255 : 0;
                        const envelope = Math.sin(normX * Math.PI);

                        const wave1 = Math.sin(t * 2.5 + normX * 8 + linePhase) * 14 * (0.3 + globalIntensity);
                        const wave2 = Math.cos(t * 1.8 - normX * 12 + linePhase * 1.5) * 8 * (0.3 + globalIntensity);
                        const audioDisp = rawAmp * minDim * 0.22 * envelope * (1 + climaxLevel * 0.8);

                        const targetDisp = (wave1 + wave2 - audioDisp);
                        lineDisplacements[lineOffset + s] += (targetDisp - lineDisplacements[lineOffset + s]) * 0.35;
                        const y = lineY + lineDisplacements[lineOffset + s];

                        if (s === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    }

                    const lineHue = (bgHue + l * 18 + globalIntensity * 40) % 360;
                    const [lr, lg, lb] = hslToRgb(lineHue, 85, 60);
                    ctx.strokeStyle = `rgba(${Math.round(lr)},${Math.round(lg)},${Math.round(lb)},${0.6 + globalIntensity * 0.4})`;
                    ctx.lineWidth = Math.max(2, (W / 1000) * 2.5);
                    ctx.lineCap = 'round';
                    ctx.stroke();
                }

                // Shockwaves
                for (let i = shockwaves.length - 1; i >= 0; i--) {
                    const sw = shockwaves[i];
                    sw.progress += 0.025;
                    if (sw.progress >= 1) {
                        shockwaves.splice(i, 1);
                        continue;
                    }
                    const radius = sw.progress * sw.maxRadius;
                    const alpha = (1 - sw.progress) * sw.alpha;
                    const [r, g, b] = hslToRgb(sw.hue, 80, 60);
                    ctx.strokeStyle = `rgba(${Math.round(r)},${Math.round(g)},${Math.round(b)},${alpha})`;
                    ctx.lineWidth = 3 * (1 - sw.progress);
                    ctx.beginPath();
                    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
                    ctx.stroke();
                }

                // Particles
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life -= p.decay;
                    if (p.life <= 0) {
                        particles.splice(i, 1);
                        continue;
                    }
                    const [r, g, b] = hslToRgb(p.hue, 80, 60);
                    ctx.fillStyle = `rgba(${Math.round(r)},${Math.round(g)},${Math.round(b)},${p.life * 0.8})`;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        }
    </script>
</body>
</html>
